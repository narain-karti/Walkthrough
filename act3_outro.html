<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pulse — Act 3: The Receipt</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --card-border: #222228;
      --accent: #bfff62;
      --text: #fcfcfd;
      --text-muted: #8e8e93;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .ambient-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(191, 255, 98, 0.09) 0%, transparent 70%);
      bottom: -150px;
      pointer-events: none;
    }
    .hero-container {
      text-align: center;
      margin-bottom: 32px;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(191, 255, 98, 0.12);
      border: 1px solid rgba(191, 255, 98, 0.3);
      border-radius: 20px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      animation: fadeIn 0.6s ease forwards;
    }
    .title {
      font-size: 54px;
      font-weight: 850;
      letter-spacing: -2px;
      animation: fadeIn 0.8s ease 0.2s forwards;
    }
    /* Terminal Card */
    .terminal-card {
      width: 820px;
      background: #121215;
      border: 1px solid #282832;
      border-radius: 14px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      z-index: 10;
      animation: popUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    .terminal-header {
      height: 38px;
      background: #18181c;
      border-bottom: 1px solid #222228;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    .terminal-title {
      font-family: monospace;
      font-size: 12px;
      color: #71717a;
      margin-left: 8px;
    }
    .terminal-body {
      padding: 28px 32px;
      font-family: "JetBrains Mono", Consolas, Monaco, monospace;
      font-size: 16px;
      line-height: 1.7;
    }
    .prompt-line {
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .prompt-symbol {
      color: var(--accent);
      font-weight: 700;
    }
    .typing-text {
      border-right: 2px solid var(--accent);
      white-space: nowrap;
      animation: blink 0.75s step-end infinite;
    }
    .receipt-item {
      color: #a1a1aa;
      font-size: 14px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards;
    }
    .receipt-item.check { color: #4ade80; }
    .item-1 { animation-delay: 1.8s; }
    .item-2 { animation-delay: 2.2s; }
    .item-3 { animation-delay: 2.6s; }

    .cta-container {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 0.8s ease 3.0s forwards;
    }
    .btn-cta {
      background: var(--accent);
      color: #09090b;
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(191, 255, 98, 0.35);
    }
    .url-text {
      color: var(--text-muted);
      font-family: monospace;
      font-size: 14px;
    }

    @keyframes popUp {
      from { opacity: 0; transform: scale(0.92) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes blink {
      50% { border-color: transparent; }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="hero-container">
    <div class="badge">Production Ready Receipt</div>
    <h1 class="title">Observe everything. Miss nothing.</h1>
  </div>

  <div class="terminal-card">
    <div class="terminal-header">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <span class="terminal-title">bash — nexus-pulse</span>
    </div>
    <div class="terminal-body">
      <div class="prompt-line">
        <span class="prompt-symbol">❯</span>
        <span id="typed" class="typing-text">npm install @nexus/pulse --save-exact</span>
      </div>
      <div class="receipt-item check item-1">✓ Connected to 14 Edge Regions in 12.4ms</div>
      <div class="receipt-item check item-2">✓ OpenTelemetry & Prometheus scraping active</div>
      <div class="receipt-item check item-3">✓ Zero-copy memory architecture engaged</div>
    </div>
  </div>

  <div class="cta-container">
    <a href="#" class="btn-cta">Start Free Telemetry →</a>
    <span class="url-text">docs.nexuspulse.io</span>
  </div>
</body>
</html>
